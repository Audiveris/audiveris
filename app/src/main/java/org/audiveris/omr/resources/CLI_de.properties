# This file gathers resources to be injected in the CLI class
#
# This is the "de" (German) version

# Usages

-batch      = Ohne grafische Benutzeroberfläche ausführen
-constant   = Wert einer Anwendungskonstante festlegen
-export     = MusicXML exportieren
-force      = Erneute Verarbeitung von Schritt/Transkription erzwingen
-help       = Allgemeine Hilfe anzeigen und dann beenden
-output     = Basis-Ausgabeordner festlegen
-playlist   = Ein Gesamtwerk aus einer Wiedergabeliste erstellen
-print      = Werk ausdrucken
-save       = Im Stapelverarbeitungsmodus: Werk nach jedem erfolgreichen Schritt speichern
-sheets     = Notenblattnummern und -bereiche auswählen (z. B. 1, 4-5)
-step       = Einen bestimmten Zielschritt festlegen
-swap       = Jedes Notenblatt nach dessen Verarbeitung austauschen
-transcribe = Gesamtes Werk transkribieren
-upgrade    = Datei des gesamten Werks aktualisieren
-version    = Version anzeigen und dann beenden
--.usage    = Markierung für das Ende der Optionen
-annotate   = (Erweitert) Alle Symbole im Werk mit Anmerkungen versehen
-run        = (Erweitert) Eine bereitgestellte Klasse auf gültige Notenblätter anwenden
-sample     = (Erweitert) Alle Symbole im Werk erfassen (Sampling)

# MetaVars

<-->                    =
<file.xml>              = <Datei.xml>
<int[]>                 = <Array von Ganzzahlen>
<key.value.pair>        = <qualifizierter-Schlüssel=Wert>
<folder>                = <Ordner>
<qualified-class-name>  = <qualifizierter Klassenname>
<step>                  = <Schritt>

# Print

extensions.omr          = .omr        : Buchdatei (Eingabe/Ausgabe)
extensions.other        = [sonstige]  : Bilddatei (Eingabe)
extensions.title        = Eingabedateiendungen:
file                    = Inhalt der Datei wird direkt an der entsprechenden Stelle eingefügt
file.title              = @Datei:
options.title           = Optionen:
steps.title             = Die Verarbeitungsschritte erfolgen in dieser Reihenfolge:
syntax                  = [OPTIONEN] [--] [EINGABEDATEIEN]
syntax.title            = Syntax:

# Messages

cancelled               = Verarbeitung auf {0} unterbrochen
could.not.find.file     = Datei {0} konnte nicht gefunden werden
error.in.reaching.step  = Fehler beim Erreichen von Schritt {0}
error.in.transcribing   = Fehler bei der Transkription von {0}
error.in                = Fehler in {0} {1}
error.running           = Fehler bei der Ausführung von {0} {1}
exception.occurred      = Ausnahme aufgetreten: {0}
export.error            = Exportfehler
invalid.step.name       = Ungültiger Schrittname: „{0}“
transcribe.incompatible = Option „-transcribe“ ist nicht mit der Option „-step {0}“ kompatibel
