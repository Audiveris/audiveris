# This file gathers resources to be injected in the CLI class
#
# This is the "fr" (French) version

# Usages

-batch      = Exécute le programme sans interface graphique
-constant   = Définit la valeur d'une constante applicative
-export     = Exporte en MusicXML
-force      = Force la ré-exécution d'une étape ou d'une transcription
-help       = Affiche l'aide générale puis sort
-output     = Définit le répertoire de base pour les sorties
-playlist   = Crée un classeur composite à partir d'une playlist
-print      = Imprime le classeur
-save       = En batch, sauvegarde le classeur après chaque étape réussie
-sheets     = Sélectionne les numéros/plages de feuilles (1 4-5)
-step       = Definit l'étape à atteindre
-swap       = Décharge chaque feuille après son traitement
-transcribe = Transcrit tout le classeur
-upgrade    = Met à jour tout le classeur
-version    = Affiche la version puis sort
--.usage    = Marque la fin des options
-annotate   = (advancé) Annote tous les symboles du classeur
-run        = (advancé) Exécute la classe sur toutes les feuilles valides
-sample     = (advancé) Echantillonne tous les symboles du classeur

# MetaVars

<-->                    =
<file.xml>              = <fichier.xml>
<int[]>                 = <tableau d'entiers>
<key.value.pair>        = <clé-qualifiée=valeur>
<folder>                = <répertoire>
<qualified-class-name>  = <Nom de classe qualifié>
<step>                  = <étape>

# Others

extensions.omr          = .omr    : fichier de classeur  (entrée/sortie)
extensions.other        = [autre] : fichier d'image (entrée)
extensions.title        = Extensions des fichiers d'entrée :
file                    = Contenu du fichier à developper sur place
file.title              = @fichier :
options.title           = Options :
steps.title             = Etapes de traitement dans l'ordre :
syntax                  = [OPTIONS] [--] [FICHIERS D'ENTREE]
syntax.title            = Syntaxe :

# Messages

cancelled               = Traitement interrompu sur {0}
could.not.find.file     = Le fichier {0} est introuvable
error.in                = Erreur dans {0} {1}
error.in.reaching.step  = Erreur en visant l'étape {0}
error.in.transcribing   = Erreur en transcrivant {0}
error.running           = Erreur à l'exécution de {0} {1}
exception.occurred      = Une exception s'est produite {0}
export.error            = Erreur d'exportation
invalid.step.name       = Nom d'étape invalide : "{0}"
transcribe.incompatible = Option "-transcribe" incompatible avec l'option "-step {0}"


