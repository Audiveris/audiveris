# This file gathers resources to be injected in the CLI class
#
# This is the "fi" (Finnish) version

# Usages

-batch                  = Suorita ilman graafista käyttöliittymää
-constant               = Määritä sovellusvakion arvo
-export                 = Vie MusicXML-muodossa
-force                  = Pakota vaiheen/transkription uudelleenkäsittely
-help                   = Näytä yleiset ohjeet ja lopeta
-output                 = Määritä tulostuskansion perussijainti
-playlist               = Luo yhdistetty kirja soittolistan perusteella
-print                  = Tulosta kirja
-save                   = Tallenna kirja jokaisen onnistuneen vaiheen jälkeen (eräajotilassa)
-sheets                 = Valitse sivunumerot ja -välit (esim. 1 4-5)
-step                   = Määritä tietty kohdevaihe
-swap                   = Poista sivu muistista käsittelyn jälkeen
-transcribe             = Suorita koko kirjan transkriptio
-upgrade                = Päivitä koko kirjatiedosto
-version                = Näytä versio ja lopeta
--.usage                = Valitsimien päättymisen merkki
-annotate               = (edistynyt) Lisää merkintöjä kaikkiin kirjan symboleihin
-run                    = (edistynyt) Suorita annettu luokka kelvollisille sivuille
-sample                 = (edistynyt) Kerää näytteitä kaikista kirjan symboleista

# MetaVars

<-->                    =
<file.xml>              = <file.xml>
<int[]>                 = <int[]>
<key.value.pair>        = <avain=arvo>
<folder>                = <kansio>
<qualified-class-name>  = <luokan_täydellinen_nimi>
<step>                  = <vaihe>

# Print

extensions.omr          = .omr        : kirjatiedosto (syöte/tuloste)
extensions.other        = [muu]       : kuvatiedosto (syöte)
extensions.title        = Syötetiedostojen tiedostopäätteet:
file                    = Tiedoston sisältö, joka laajennetaan riville
file.title              = @file:
options.title           = Valitsimet:
steps.title             = Sivujen käsittelyvaiheet järjestyksessä:
syntax                  = [VALITSIMET] [--] [SYÖTETIEDOSTOT]
syntax.title            = Syntaksi:

# Messages

cancelled               = Käsittely keskeytettiin kohteessa {0}
could.not.find.file     = Tiedostoa {0} ei löytynyt
error.in.reaching.step  = Virhe siirryttäessä vaiheeseen {0}
error.in.transcribing   = Virhe transkriptiossa: {0}
error.in                = Virhe kohteessa {0} {1}
error.running           = Virhe suoritettaessa kohdetta {0} {1}
exception.occurred      = Tapahtui poikkeus: {0}
export.error            = Virhe viennissä
invalid.step.name       = Virheellinen vaiheen nimi: ”{0}”
transcribe.incompatible = ”-transcribe”-valitsin ei ole yhteensopiva ”-step {0}” -valitsimen kanssa