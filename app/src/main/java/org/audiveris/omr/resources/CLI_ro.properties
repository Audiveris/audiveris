# This file gathers resources to be injected in the CLI class
#
# This is the "ro" (Romanian) version

# Usages

-batch      = Executare fără interfață grafică cu utilizatorul
-constant   = Definirea valorii unei constante a aplicației
-export     = Exportare în format MusicXML
-force      = Forțarea reprocesării unei etape/transcrieri
-help       = Afișarea ajutorului general, apoi oprire
-output     = Definirea folderului de bază pentru rezultate
-playlist   = Crearea unei lucrări compuse dintr-o listă de redare
-print      = Tipărirea lucrării
-save       = În modul de procesare în lot, salvarea lucrării după fiecare etapă finalizată cu succes
-sheets     = Selectarea numerelor și intervalelor de pagini (1 4-5)
-step       = Definirea unei etape țintă specifice
-swap       = Înlocuirea fiecărei pagini după procesarea acesteia
-transcribe = Transcrierea întregii lucrări
-upgrade    = Actualizarea fișierului întregii lucrări
-version    = Afișarea versiunii, apoi oprire
--.usage    = Marcator de final al opțiunilor
-annotate   = (avansat) Adăugarea de adnotări tuturor simbolurilor din lucrare
-run        = (avansat) Executarea unei clase specificate pe paginile valide
-sample     = (avansat) Eșantionarea tuturor simbolurilor din lucrare

# MetaVars

<-->                    =
<file.xml>              = <fişier.xml>
<int[]>                 = <matrice de numere întregi>
<key.value.pair>        = <cheie-calificată=valoare>
<folder>                = <folder>
<qualified-class-name>  = <nume-clasă-calificată>
<step>                  = <pas>

# Print

extensions.omr          = .omr        : fișier carte (intrare/ieșire)
extensions.other        = [orice altceva] : fișier imagine (intrare)
extensions.title        = Extensii pentru fișierele de intrare:
file                    = Conținutul fișierului care trebuie expandat inline
file.title              = @fișier:
options.title           = Opțiuni:
steps.title             = Etapele foii sunt în ordine:
syntax                  = [OPȚIUNI] [--] [FIȘIERE_INTRARE]
syntax.title            = Sintaxă:

# Messages

cancelled               = Procesare întreruptă la {0}
could.not.find.file     = Nu s-a putut găsi fișierul {0}
error.in.reaching.step  = Eroare la atingerea etapei {0}
error.in.transcribing   = Eroare la transcrierea {0}
error.in                = Eroare în {0} {1}
error.running           = Eroare la rularea {0} {1}
exception.occurred      = A apărut o excepție: {0}
export.error            = Eroare la export
invalid.step.name       = Nume de etapă nevalid: „{0}”
transcribe.incompatible = Opțiunea „-transcribe” este incompatibilă cu opțiunea „-step {0}”

