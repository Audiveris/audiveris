# This file gathers resources to be injected in the CLI class
#
# This is the Romanian version

# Folosire

-batch      = Rulează fără interfață grafică utilizator
-constant   = Definește valoare pentru o constantă de aplicație
-export     = Exportă MusicXML
-force      = Forțează reprocesare pas/transcriere
-help       = Afișează ajutor general apoi închide
-output     = Definește dosarul de ieșire implicit
-playlist   = Construiește o carte compusă din listă de fișiere
-print      = Tipărește cartea
-save       = În batch, salvează cartea după fiecare pas reușit
-sheets     = Selectează numerele de pagini (1 4-5)
-step       = Definește un pas țintă specific
-swap       = Elimină fiecare foaie după procesare
-transcribe = Transcrie întreaga carte
-upgrade    = Actualizează întreaga carte
-version    = Afișează versiunea apoi închide
--.usage    = Marcator de sfârșit de opțiuni
-annotate   = (avansat) Anotează toate simbolurile din carte
-run        = (avansat) Rulează clasa specificată pe toate foile valide
-sample     = (avansat) Eșantionează toate simbolurile din carte

# MetaVariabile

<-->                    =
<file.xml>              = <fișier.xml>
<int[]>                 = <tablou de intrări>
<key.value.pair>        = <cheie-calificată=valoare>
<folder>                = <dosar>
<qualified-class-name>  = <nume-clasă-calificată>
<step>                  = <pas>

# Tipărire

syntax.title        = Sintaxă:
syntax              = [OPȚIUNI] [--] [FIȘIERE_INTRARE]

file.title          = @fișier:
file                = Conținutul fișierului care trebuie extins în linie

options.title       = Opțiuni:

extensions.title    = Extensii fișiere de intrare:
extensions.omr      = .omr     : fișier carte (intrare/ieșire)
extensions.other    = [altele] : fișier imagine (intrare)

steps.title         = Pașii paginii sunt în ordine:

# Mesaje

cancelled               = Procesarea a fost întreruptă la {0}
could.not.find.file     = Nu s-a putut găsi fișierul {0}
error.in.reaching.step  = Eroare în atingerea pasului {0}
error.in.transcribing   = Eroare în transcrierea {0}
error.in                = Eroare în {0} {1}
error.running           = Eroare la rularea {0} {1}
exception.occurred      = A apărut o excepție {0}
export.error            = Eroare la export
invalid.step.name       = Nume de pas invalid: „{0}”
transcribe.incompatible = Opțiunea '-transcribe' este incompatibilă cu opțiunea '-step {0}' option
