# This file gathers resources to be injected in the CLI class
#
# This is the generic (English) version



# Usages

-batch      = Run with no graphic user interface
-constant   = Define value of an application constant
-export     = Export MusicXML
-force      = Force step/transcribe re-processing
-help       = Display general help then stop
-output     = Define base output folder
-playlist   = Build a compound book from playlist
-print      = Print out book
-save       = In batch, save book on every successful step
-sheets     = Select sheet numbers and ranges (1 4-5)
-step       = Define a specific target step
-swap       = Swap out every sheet after its processing
-transcribe = Transcribe whole book
-upgrade    = Upgrade whole book file
-version    = Display version then stop
--.usage    = End-of-options marker
-annotate   = (advanced) Annotate all book symbols
-run        = (advanced) Run provided class on valid sheets
-sample     = (advanced) Sample all book symbols

# MetaVars

<-->                    =
<file.xml>              = <file.xml>
<int[]>                 = <int[]>
<key.value.pair>        = <qualified-key=value>
<folder>                = <folder>
<qualified-class-name>  = <qualified-class-name>
<step>                  = <step>

# Print

syntax.title        = Syntax:
syntax              = [OPTIONS] [--] [INPUT_FILES]

file.title          = @file:
file                = Content of file to be expanded in line

options.title       = Options:

extensions.title    = Input file extensions:
extensions.omr      = .omr        : book file  (input/output)
extensions.other    = [any other] : image file (input)

steps.title         = Sheet steps are in order:

# Messages

cancelled               = Processing interrupted on {0}
could.not.find.file     = Could not find file {0}
error.in.reaching.step  = Error in reaching step {0}
error.in.transcribing   = Error in transcribing {0}
error.in                = Error in {0} {1}
error.running           = Error running {0} {1}
exception.occurred      = Exception occurred {0}
export.error            = Export error
invalid.step.name       = Invalid step name: "{0}"
transcribe.incompatible = '-transcribe' option incompatible with '-step {0}' option
