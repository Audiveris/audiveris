# V10: käyttäjälle näkyvät asetusten kuvaukset (tekniset tunnisteet säilyvät)
Topic.SWAPPED_SHEETS.toolTipText = Käsitellyt nuottisivut vapautetaan automaattisesti muistista (Automatic swap out of sheets once they are processed)
Topic.PARALLEL_SYSTEMS.toolTipText = Käsittele nuottijärjestelmiä rinnakkain soveltuvissa vaiheissa (Systems processed in parallel for relevant steps)
Topic.MULTIPLE_DELETE.toolTipText = Salli useiden kohteiden poistaminen ilman vahvistusta (Multiple delete without user confirmation)
Topic.CUSTOM_SHAPE_SET.toolTipText = Käytä henkilökohtaista nuottimerkkivalikoimaa (Handling of a personal set of shapes)
Topic.SAMPLES.toolTipText = Näytekokoelmien ja luokittimen käsittely (Handling of samples repositories and classifier)
Topic.ANNOTATIONS.toolTipText = Luo nuottimerkeillä varustettuja kuvamerkintöjä (Production of image annotation with symbols)
Topic.PLOTS.toolTipText = Näytä mittakaavan, varsien ja viivastojen kuvaajat (Display of scale / stem / staves plots)
Topic.SPECIFIC_VIEWS.toolTipText = Näytä nuottisivun erikoisnäkymät (Display of specific sheet views)
Topic.SPECIFIC_ITEMS.toolTipText = Näytä erikoiskohteet nuottisivulla (Specific items shown in sheet view)
Topic.DEBUG.toolTipText = Ota käyttöön virheenjäljitystoiminnot (Support for debug features)
