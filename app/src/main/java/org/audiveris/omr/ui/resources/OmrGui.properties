# This file gathers resources to be injected in the OmrGui class
#
# This is the generic (English) version

# Standard application properties
# -------------------------------

# An identifier used for system-level naming, 
# such as the local storage directory path where LocalStorage saves session state.
# Defaults to the Application subclass's simple name if omitted.
Application.id              = audiveris

# A short, human-readable name for the application, typically just a few words.
Application.name            = Audiveris

# The display title used for main frames and dialogs.
# In SingleFrameApplication, this serves as the fallback title for mainFrame
# if mainFrame.title is not explicitly set.
Application.title           = Audiveris Music Scanner

# The version string of the application, commonly injected into "About" dialogs or window titles.
Application.version         = ???

# The full, proper name of the organization or developer behind the application.
Application.vendor          = Audiveris Ltd.

# A file-system-safe identifier for the vendor.
# Combined with Application.id to construct the OS-specific LocalStorage directory path
Application.vendorId        = AudiverisLtd


# The URL for the application's website or documentation.
Application.homepage        = http://www.audiveris.org

# A brief, one-sentence summary of what the application does.
Application.description     = Optical Music Recognition

# Controls the Swing UIManager Look & Feel at startup.
# Accepts "system" (native OS look), "default" (JVM cross-platform/Metal look),
# or a fully qualified LookAndFeel class name.
Application.lookAndFeel     =   com.formdev.flatlaf.FlatLightLaf

# Additional application properties (?)
# ---------------------------------

Application.icon            = icon-24.png
Application.projectpage     = https://github.com/Audiveris/audiveris

# References to selected Crystal icons
# ------------------------------------

smallIcons                  = /crystal/22x22
largeIcons                  = /crystal/32x32
