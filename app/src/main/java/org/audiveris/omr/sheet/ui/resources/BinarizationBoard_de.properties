# This file gathers resources to be injected in the BinarizationBoard class
#
# This is the "de" (German) version

adaptiveFilter.text         = Adaptiven Filter verwenden (empfohlen)
adaptiveFilter.toolTipText  = Wandelt ein Pixel in Schwarz oder Weiß um, basierend auf den umgebenden Pixeln

adaptiveMean.text           = Mittelwert-Koeffizient
adaptiveMean.toolTipText    = Koeffizient für den Mittelwert

adaptiveStdDev.text         = Standardabweichungs-Koeffizient
adaptiveStdDev.toolTipText  = Koeffizient für die Standardabweichung

apply.text                  = Anwenden (Enter)
apply.toolTipText           = Filter und Parameter auf das Graustufenbild des Tabellenblatts anwenden

applyToWholeBook.text       = Auf gesamte Arbeitsmappe anwenden
applyToWholeBook.toolTipText    = Filter und Parameter für die gesamte Arbeitsmappe festlegen


globalFilter.text           = Globalen Filter verwenden
globalFilter.toolTipText    = Wandelt in Schwarz oder Weiß um, basierend auf einem globalen Schwellenwert für das gesamte Bild

globalThreshold.text        = Schwellenwert
globalThreshold.toolTipText = Graustufen-Schwellenwert

noGraySourceLabel.text      = Kein Graustufenbild zur Binarisierung vorhanden

overwrite.text              = Alle Tabellenblätter überschreiben?
overwrite.toolTipText       = Sollen bei der Verarbeitung der gesamten Arbeitsmappe alle Tabellenblätter überschrieben werden?

reset.text                  = Zurücksetzen