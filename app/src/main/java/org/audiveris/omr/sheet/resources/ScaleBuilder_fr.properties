# Messages

beam.guessed.height             = Epaisseur estimée de ligature : %2d -- %.2f de la plage [%d..%d]
beam.measured.height            = Epaisseur mesurée de ligature : %2d -- %.2f de la plage [%d..%d] à %d%% du quorum demandé
error.in.plotting.black.values  = Erreur lors du tracé des valeurs noires {0}
error.in.plotting.combo.values  = Erreur lors du tracé des valeurs combinées {0}
no.reliable.beam.height.found   = Aucune épaisseur de ligature fiable n'a été trouvée ; valeur estimée : {0}
sheet.scale.data.already.set    = Données d'échelle de la feuille déjà définies
significant.beam.peak.detected  = Pic de ligature significatif détecté : {0} pixels
user.specified.beam.height      = Epaisseur de ligature spécifiée par l'utilisateur : {0} pixels
user.specified.interline        = Interligne spécifié par l'utilisateur : {0} pixels

too.few.black.pixels            = {0}\n\\n\
                                  Trop peu de pixels noirs : {1} de l'image entière.\n\
                                  Cette feuille est presque vierge.

too.high.interline              = {0}\n\n\
                                  Avec une valeur d'interligne trop élevée ({1} pixels),\n\
                                  cette feuille ne semble pas contenir de portées à plusieurs lignes.\n\n\
                                  Cette valeur d'interligne n'est PAS FIABLE !

too.low.interline               = {0}\n\n\
                                  Avec une valeur d'interligne trop faible ({1} pixels),\n\
                                  soit cette feuille ne contient pas de portées sur plusieurs lignes,\n\
                                  soit la résolution de l'image est trop basse (essayez 300 DPI).\n\n\
                                  Cette valeur d'interligne n'est PAS FIABLE !
