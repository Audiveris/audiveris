                                      paroles.</html>

Constants.multiWholeHeadChords.text    = Accords de rondes
Constants.multiWholeHeadChords.toolTipText = <html>Accords contenant plusieurs rondes.</html>

Constants.partialWholeRests.text       = Pauses plus courtes que la mesure
Constants.partialWholeRests.toolTipText= <html>Les pauses peuvent être plus courtes que la mesure.<br> \
                                      (S'applique uniquement à la <b>PAUSE</b>, pas aux silences \
