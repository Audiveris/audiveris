Constants.pluckings.text               = Doigtés (p, i, m, a)
Constants.pluckings.toolTipText        = <html>Guitare main droite\u00a0:<br> \
                                      ("p" pour le pouce, "i" pour l'index, "m" pour le majeur, \
                                      'a' pour l'annulaire)</html>

Constants.smallHeads.text              = Petites têtes de notes
Constants.smallHeads.toolTipText       = Têtes de notes de taille réduite

Constants.smallBeams.text              = Petites ligatures
Constants.smallBeams.toolTipText       = Ligatures de taille réduite

Constants.tremolos.text                = Trémolos
Constants.tremolos.toolTipText         = <html>Trémolos avec 1 à 3 slashs.</html>

