# Scaling processing switches

Constants.oneLineStaves.text               = Portées de percussion à 1 ligne
Constants.oneLineStaves.toolTipText        = <html>Notation de percussion sans hauteur, \
                                          se produisant sur des portées d'une seule ligne.</html>

Constants.fourStringTablatures.text        = Tablatures de basse à 4 cordes
Constants.fourStringTablatures.toolTipText = <html><b>Note</b>\u00a0: De telles tablatures seront détectées \
                                          mais leur contenu <b>ignoré</b>.</html>

Constants.fiveLineStaves.text              = Portées standard à 5 lignes 
Constants.fiveLineStaves.toolTipText       = <html>Notation standard, sur portées de cinq lignes.</html>

Constants.drumNotation.text                = Portées de percussions sur 5 lignes
Constants.drumNotation.toolTipText         = <html>Notation de percussion sans hauteur, \
                                          se produisant sur des portées de cinq lignes.</html>

Constants.sixStringTablatures.text         = Tablatures de guitare à 6 cordes
Constants.sixStringTablatures.toolTipText  = <html><b>Note</b>\u00a0: De telles tablatures seront détectées \
                                          mais leur contenu <b>ignoré</b>.</html>

# Other processing switches (in enum order preferably)

Constants.articulations.text           = Articulations
Constants.articulations.toolTipText    = <html>Accent, tenuto, staccato, staccatissimo, \
                                             fort accent.</html>

Constants.bothSharedHeadDots.text      = Lier les augmentations aux 2 têtes en mirroir
Constants.bothSharedHeadDots.toolTipText   = <html>Pour les têtes en mirroir, associer l'augmentation aux <b>deux</b> têtes,\
                                             <br>au lieu de juste l'accord de plus longue durée.\
                                             <br>\
                                             <br><b>Note</b>\u00a0: Ceci s'applique uniquement aux têtes situées \
                                             <b>entre</b> les lignes de portée ou les lignes supplémentaires.</html>

Constants.chordNames.text              = Noms d'accord
Constants.chordNames.toolTipText       = <html>par exemple. F&#x266F;m7, Em&#x266D;5, D7&#x266F;5, \
                                       Am7&#x266D;5, A(9), BMaj7/D&#x266F;</html>

Constants.crossHeads.text              = Notes en croix
Constants.crossHeads.toolTipText       = <html>Notes <b>Ghost</b>, sans hauteur perceptible, \
                                      représentées par un '<b>X</b>'.</html>

Constants.fingerings.text              = Doigtés chiffrés
Constants.fingerings.toolTipText       = <html>Indication du doigt\u00a0: 0, 1, 2, 3, 4, 5.</html>

Constants.frets.text                   = Frettes en chiffres romains (I, II, IV...)
Constants.frets.toolTipText            = <html>Non encore implémenté</html>

Constants.implicitTuplets.text         = Triplets implicites
Constants.implicitTuplets.toolTipText  = <html>Si nécessaire, le rythme de la mesure peut être corrigé \
                                      par insertion automatique de n-olets virtuels.</html>

Constants.indentations.text            = Utiliser l'indentation des systèmes
Constants.indentations.toolTipText     = <html>S'appuyer sur l'indentation relative d'un système pour \
                                      détecter le début d'un nouveau mouvement.</html>

Constants.keepGrayImages.text          = Conserver les images en niveaux de gris
Constants.keepGrayImages.toolTipText   = <html>Conserver les images en niveaux de gris dans les \
                                      fichiers de projet .omr.<br>\
                                      (Noter que la version <b>binaire</b> de l'image est toujours \
                                      conservée)</html>

Constants.lyrics.text                  = Paroles
Constants.lyrics.toolTipText           = <html>Les lignes de texte sous la portée seront considérées \
                                      comme des lignes de paroles.</html>

Constants.lyricsAboveStaff.text        = Paroles, même au-dessus de la portée
Constants.lyricsAboveStaff.toolTipText = <html>Les lignes de texte <b>au-dessus</b> de la portée, \
