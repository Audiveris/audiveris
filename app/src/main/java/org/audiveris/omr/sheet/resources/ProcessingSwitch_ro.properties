# This file gathers resources to be injected in the ProcessingSwitch class
#
# This is the Romanian version

# Scaling processing switches

oneLineStaves.text               = Portative de percuție cu 1 linie
oneLineStaves.toolTipText        = <html>Notație de percuție fără înălțime, care apare pe portative cu o singură linie.</html>

fourStringTablatures.text        = Tabulatură de bază cu 4 coarde
fourStringTablatures.toolTipText = <html><b class="Note">Notă</b>: Aceste tabulaturi vor fi detectate dar conținutul lor va fi <b>ignorat</b>.</html>

fiveLineStaves.text              = Portative standard cu 5 linii
fiveLineStaves.toolTipText       = <html>Notație standard, pe portative cu cinci linii.</html>

drumNotation.text                = Portative de percuție cu 5 linii
drumNotation.toolTipText         = <html>Notație de percuție fără înălțime, care apare pe portative cu cinci linii.</html>

sixStringTablatures.text         = Tabulatură de chitară cu 6 coarde
sixStringTablatures.toolTipText  = <html><b class="Note">Notă</b>: Aceste tabulaturi vor fi detectate dar conținutul lor va fi <b>ignorat</b>.</html>

# Other processing switches (in enum order preferably)

articulations.text           = Articulații
articulations.toolTipText    = <html>Accent, tenuto, staccato, staccatissimo, accent puternic.</html>

bothSharedHeadDots.text      = Legarea augmentărilor la cele 2 capete în oglindă
bothSharedHeadDots.toolTipText   = <html>Pentru capete în oglindă, leagă punctul de augmentare la <b>ambele</b> capete,<br>în loc doar de acordul cu durata mai lungă.<br><br><b class="Note">Nota</b>: Aceasta se aplică doar capetelor situate <b>între</b> liniile portativului sau liniile de extensie.</html> 

chordNames.text              = Nume de acord
chordNames.toolTipText       = <html>ex. F&#x266F;m7, Em&#x266D;5, D7&#x266F;5, Am7&#x266D;5, A(9), BMaj7/D&#x266F;</html>

crossHeads.text              = Note în cruce
crossHeads.toolTipText       = <html>Note <b>Ghost</b>, fără înălțime discernibilă, reprezentate printr-un '<b class="X">X</b>'.</html>

fingerings.text              = Cifre digitație
fingerings.toolTipText       = <html>Cifrele digitație: 0, 1, 2, 3, 4, 5.</html>

frets.text                   = Taste cu cifre romane (I, II, IV...)
frets.toolTipText            = <html>Neimplementat încă</html>

implicitTuplets.text         = Diviziuni excepționale implicite
implicitTuplets.toolTipText  = <html>Când este necesar, ritmul măsurii poate fi corectat prin inserarea automată a diviziunilor excepționale virtuale.</html>

indentations.text            = Utilizarea indentării sistemelor
indentations.toolTipText     = <html>Se bazează pe indentarea relativă a sistemului pentru a detecta începutul unui nou mișcare.</html> 

keepGrayImages.text          = Păstrarea imaginilor în nuanțe de gri
keepGrayImages.toolTipText   = <html>Păstrează imaginile în nuanțe de gri în fișierele de proiect .omr.<br>(Notă: versiunea <b>binară</b> a imaginii este întotdeauna păstrată)</html>

lyrics.text                  = Versuri
lyrics.toolTipText           = <html>Linii de text dedesubtul portativului vor fi considerate ca linii de text liric.</html>

lyricsAboveStaff.text        = Versuri, deasupra portativului
lyricsAboveStaff.toolTipText = <html>Linii de text <b>deasupra</b> portativului, precum și dedesubt, vor fi considerate ca linii de text liric.</html>

multiWholeHeadChords.text    = Acorduri de note întregi
multiWholeHeadChords.toolTipText = <html>Acorduri care conțin mai multe note întregi.</html>

partialWholeRests.text       = Pauze mai scurte decât măsura
partialWholeRests.toolTipText= <html>Pauzele întregi pot fi mai scurte decât măsura.<br>(Se aplică doar formei <b>WHOLE</b>, nu BREVE sau LONG) </html>

pluckings.text               = Ciupituri (p, i, m, a)
pluckings.toolTipText        = <html>Mâna dreaptă pentru chitară:<br>("p" pentru degetul mare, "i" pentru degetul arătător, "m" pentru degetul mijlociu, 'a' pentru degetul inelar)</html>

smallHeads.text              = Capete mici de note
smallHeads.toolTipText       = <html>Versiune <b>Cue</b> a capetelor ovale.</html>

smallBeams.text              = Ligaturi mici
smallBeams.toolTipText       = <html>Versiune <b>Cue</b> a ligaturilor.</html>

tremolos.text                = Tremolo
tremolos.toolTipText         = <html>Tremolo cu 1 la 3 tăieturi.</html>

dynamicsAboveStaff.text = Nuanțele plasate deasupra portativului
dynamicsAboveStaff.toolTipText = <html>Acceptă elemente de dinamica situate <b>deasupra</b> portativului.</html>

dynamicsBelowStaff.text = Nuanțele plasate dedesubtul portativului
dynamicsBelowStaff.toolTipText = <html>Acceptă elemente de dinamica situate <b>dedesubt</b> portativului.</html>

disconnectedBracedParts.text = Acceptă părți deconectate cu acoladă
disconnectedBracedParts.toolTipText = <html>Consideră portativele cu acoladă ca aparținând aceleiași părți chiar și fără conectori verticali.</html>
