# This file gathers resources to be injected in the BinaryBoard class
#
# This is the "fr" (French) version

# Color names

black = noir
white = blanc

# Components

color.text                  = Couleur binaire
color.toolTipText           = Couleur binaire résultante

mean.text                   = Moyenne observée
mean.toolTipText            = Valeur moyenne observée
stdDev.text                 = Ecart-type observé

stdDev.toolTipText          = Valeur observée de l'écart-type

threshold.text              = Seuil
threshold.toolTipText       = Valeur de seuil, soit globale, soit calculée localement

# Messages

no.gray.source.available    = Aucune source de gris disponible
