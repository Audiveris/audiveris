Constants.fiveLineStaves.text              = Standard-Notensysteme (5 Linien)
Constants.fiveLineStaves.toolTipText       = <html>Standardnotation auf Systemen mit fünf Linien.</html>

Constants.drumNotation.text                = Schlagzeugsysteme (5 Linien)
Constants.drumNotation.toolTipText         = <html>Schlagzeugnotation ohne Tonhöhen, \
                                                dargestellt auf Systemen mit fünf Linien.</html>

Constants.sixStringTablatures.text         = Tabulaturen für 6-saitige Gitarren
Constants.sixStringTablatures.toolTipText  = <html><b>Hinweis</b>: Solche Tabulaturen werden zwar erkannt, \
