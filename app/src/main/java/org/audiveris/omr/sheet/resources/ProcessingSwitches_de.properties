# Scaling processing switches

Constants.oneLineStaves.text               = Einzeilige Schlagzeugsysteme
Constants.oneLineStaves.toolTipText        = <html>Schlagzeugnotation ohne Tonhöhen, \
                                                dargestellt auf einzeiligen Systemen.</html>

Constants.fourStringTablatures.text        = Tabulaturen für 4-saitige Bässe
Constants.fourStringTablatures.toolTipText = <html><b>Hinweis</b>: Solche Tabulaturen werden zwar erkannt, \
