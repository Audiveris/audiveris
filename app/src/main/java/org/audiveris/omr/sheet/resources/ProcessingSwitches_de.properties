# Other processing switches (in enum order preferably)

Constants.articulations.text           = Artikulationen
Constants.articulations.toolTipText    = <html>Akzent, Tenuto, Staccato, Staccatissimo, \
                                            starker Akzent.</html>

Constants.bothSharedHeadDots.text      = Verlängerungspunkte bei gespiegelten Notenköpfen auf beide Köpfe anwenden
Constants.bothSharedHeadDots.toolTipText   = <html>Bei gespiegelten Notenköpfen den Verlängerungspunkt <b>beiden</b> Köpfen zuordnen,\
                                                <br>anstatt nur dem Kopf, der zum längeren Notenwert gehört.\
                                                <br>\
                                                <br><b>Hinweis</b>: Dies gilt nur für Notenköpfe, die \
                                                <b>zwischen</b> den Notenlinien oder Hilfslinien liegen.</html>

Constants.chordNames.text              = Akkordbezeichnungen
Constants.chordNames.toolTipText       = <html>z. B. F&#x266F;m7, Em&#x266D;5, D7&#x266F;5, \
                                            Am7&#x266D;5, A(9), BMaj7/D&#x266F;</html>

Constants.crossHeads.text              = Noten mit Kreuzkopf
Constants.crossHeads.toolTipText       = <html><b>Ghost-Noten</b> (Geisternoten) ohne wahrnehmbare Tonhöhe, \
