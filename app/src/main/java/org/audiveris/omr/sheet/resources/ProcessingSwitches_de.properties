Constants.fingerings.text              = Fingersatz-Zahlen
Constants.fingerings.toolTipText       = <html>Angabe des Fingers: 0, 1, 2, 3, 4, 5.</html>

Constants.frets.text                   = Bünde in römischen Ziffern (I, II, IV...)
