# This file gathers resources to be injected in the ScaleItem class
#
# This is the "de" (German) version

line.text                  = Linienstärke
line.toolTipText           = Häufigster Wert für die Stärke vertikaler Linien

interline.text             = Zeilenabstand
interline.toolTipText      = Vertikaler Abstand zwischen den Linien, von Mitte zu Mitte gemessen

smallInterline.text        = Geringer Zeilenabstand
smallInterline.toolTipText = Nur anzuwenden, wenn eine Gruppe kleiner Notensysteme vorliegt

beam.text                  = Balkenstärke
beam.toolTipText           = Eher etwas kleiner als etwas größer

smallBeam.text             = Geringe Balkenstärke
smallBeam.toolTipText      = Nur anzuwenden, wenn eine Gruppe kleiner Balken vorliegt

stem.text                  = Halsstärke
stem.toolTipText           = Wert, der während des Schritts „STEM_SEEDS“ ermittelt wurde
