# This file gathers resources to be injected in the ProcessingSwitch class
#
# This is the FR version

# Scaling processing switches

oneLineStaves.text               = Portées de percussion à 1 ligne
oneLineStaves.toolTipText        = <html>Notation de percussion sans hauteur, \
                                          se produisant sur des portées d'une seule ligne.</html>

fourStringTablatures.text        = Tablatures de basse à 4 cordes
fourStringTablatures.toolTipText = <html><b>Note</b>\u00a0: De telles tablatures seront détectées \
                                          mais leur contenu <b>ignoré</b>.</html>

fiveLineStaves.text              = Portées standard à 5 lignes 
fiveLineStaves.toolTipText       = <html>Notation standard, sur portées de cinq lignes.</html>

drumNotation.text                = Portées de percussions sur 5 lignes
drumNotation.toolTipText         = <html>Notation de percussion sans hauteur, \
                                          se produisant sur des portées de cinq lignes.</html>

sixStringTablatures.text         = Tablatures de guitare à 6 cordes
sixStringTablatures.toolTipText  = <html><b>Note</b>\u00a0: De telles tablatures seront détectées \
                                          mais leur contenu <b>ignoré</b>.</html>

# Other processing switches (in enum order preferably)

articulations.text           = Articulations
articulations.toolTipText    = <html>Accent, tenuto, staccato, staccatissimo, \
                                             fort accent.</html>

bothSharedHeadDots.text      = Lier les augmentations aux 2 têtes en mirroir
bothSharedHeadDots.toolTipText   = <html>Pour les têtes en mirroir, associer l'augmentation aux <b>deux</b> têtes,\
                                             <br>au lieu de juste l'accord de plus longue durée.\
                                             <br>\
                                             <br><b>Note</b>\u00a0: Ceci s'applique uniquement aux têtes situées \
                                             <b>entre</b> les lignes de portée ou les lignes supplémentaires.</html>

chordNames.text              = Noms d'accord
chordNames.toolTipText       = <html>par exemple. F&#x266F;m7, Em&#x266D;5, D7&#x266F;5, \
                                       Am7&#x266D;5, A(9), BMaj7/D&#x266F;</html>

crossHeads.text              = Notes en croix
crossHeads.toolTipText       = <html>Notes <b>Ghost</b>, sans hauteur perceptible, \
                                      représentées par un '<b>X</b>'.</html>

fingerings.text              = Doigtés chiffrés
fingerings.toolTipText       = <html>Indication du doigt\u00a0: 0, 1, 2, 3, 4, 5.</html>

frets.text                   = Frettes en chiffres romains (I, II, IV...)
frets.toolTipText            = <html>Non encore implémenté</html>

implicitTuplets.text         = Triplets implicites
implicitTuplets.toolTipText  = <html>Si nécessaire, le rythme de la mesure peut être corrigé \
                                      par insertion automatique de n-olets virtuels.</html>

indentations.text            = Utiliser l'indentation des systèmes
indentations.toolTipText     = <html>S'appuyer sur l'indentation relative d'un système pour \
                                      détecter le début d'un nouveau mouvement.</html>

keepGrayImages.text          = Conserver les images en niveaux de gris
keepGrayImages.toolTipText   = <html>Conserver les images en niveaux de gris dans les \
                                      fichiers de projet .omr.<br>\
                                      (Noter que la version <b>binaire</b> de l'image est toujours \
                                      conservée)</html>

lyrics.text                  = Paroles
lyrics.toolTipText           = <html>Les lignes de texte sous la portée seront considérées \
                                      comme des lignes de paroles.</html>

lyricsAboveStaff.text        = Paroles, même au-dessus de la portée
lyricsAboveStaff.toolTipText = <html>Les lignes de texte <b>au-dessus</b> de la portée, \
                                      ainsi qu'en dessous, seront considérées comme des lignes de \
                                      paroles.</html>

multiWholeHeadChords.text    = Accords de rondes
multiWholeHeadChords.toolTipText = <html>Accords contenant plusieurs rondes.</html>

partialWholeRests.text       = Pauses plus courtes que la mesure
partialWholeRests.toolTipText= <html>Les pauses peuvent être plus courtes que la mesure.<br> \
                                      (S'applique uniquement à la <b>PAUSE</b>, pas aux silences \
                                      plus grands) </html>

pluckings.text               = Doigtés (p, i, m, a)
pluckings.toolTipText        = <html>Guitare main droite\u00a0:<br> \
                                      ("p" pour le pouce, "i" pour l'index, "m" pour le majeur, \
                                      'a' pour l'annulaire)</html>

smallHeads.text              = Petites têtes de notes
smallHeads.toolTipText       = Têtes de notes de taille réduite

smallBeams.text              = Petites ligatures
smallBeams.toolTipText       = Ligatures de taille réduite

tremolos.text                = Trémolos
tremolos.toolTipText         = <html>Trémolos avec 1 à 3 slashs.</html>


