# This file gathers resources to be injected in the ProcessingSwitch class
#
# This is the "de" (German) version

# Scaling processing switches

oneLineStaves.text               = Einzeilige Schlagzeugsysteme
oneLineStaves.toolTipText        = <html>Schlagzeugnotation ohne Tonhöhe \
                                        auf einzeiligen Systemen.</html>

fourStringTablatures.text        = 4-saitige Basstablaturen
fourStringTablatures.toolTipText = <html><b>Hinweis</b>: Solche Tablaturen werden erkannt, \
                                        ihr Inhalt wird jedoch <b>ignoriert</b>.</html>

fiveLineStaves.text              = Standard-Notensysteme (5 Linien)
fiveLineStaves.toolTipText       = <html>Standardnotation auf fünfzeiligen Systemen.</html>

drumNotation.text                = Schlagzeugnotation (5 Linien)
drumNotation.toolTipText         = <html>Schlagzeugnotation ohne Tonhöhe \
                                        auf fünfzeiligen Systemen.</html>

sixStringTablatures.text         = 6-saitige Gitarrentablaturen
sixStringTablatures.toolTipText  = <html><b>Hinweis</b>: Solche Tablaturen werden erkannt, \
                                        ihr Inhalt wird jedoch <b>ignoriert</b>.</html>

# Other processing switches (in enum order preferably)

articulations.text           = Artikulationen
articulations.toolTipText    = <html>Akzent, Tenuto, Staccato, Staccatissimo, \
                                    starker Akzent.</html>

bothSharedHeadDots.text      = Verlängerungspunkte bei gespiegelten Notenköpfen beiden zuordnen
bothSharedHeadDots.toolTipText   = <html>Bei gespiegelten Notenköpfen wird der Verlängerungspunkt <b>beiden</b> Köpfen zugeordnet,\
                                    <br>anstatt nur dem Akkordton mit der längeren Dauer.\
                                    <br>\
                                    <br><b>Hinweis</b>: Dies gilt nur für Notenköpfe, die \
                                    <b>zwischen</b> den Notenlinien oder Hilfslinien liegen.</html>

chordNames.text              = Akkordbezeichnungen
chordNames.toolTipText       = <html>z. B. F&#x266F;m7, Em&#x266D;5, D7&#x266F;5, \
                                    Am7&#x266D;5, A(9), BMaj7/D&#x266F;</html>

crossHeads.text              = Kreuzförmige Notenköpfe
crossHeads.toolTipText       = <html><b>Ghost-Noten</b> (Noten ohne wahrnehmbare Tonhöhe), \
                                    dargestellt durch ein '<b>X</b>'.</html>

fingerings.text              = Fingersätze (Ziffern)
fingerings.toolTipText       = <html>Angabe des Fingers: 0, 1, 2, 3, 4, 5.</html>

frets.text                   = Bünde in römischen Ziffern (I, II, IV...)
frets.toolTipText            = <html>Noch nicht implementiert</html>

implicitTuplets.text         = Implizite Tolen (Triolen etc.)
implicitTuplets.toolTipText  = <html>Bei Bedarf kann der Rhythmus des Taktes durch \
                                    automatisches Einfügen virtueller Tolen korrigiert werden.</html>

indentations.text            = System-Einrückungen verwenden
indentations.toolTipText     = <html>Die relative Einrückung eines Systems nutzen, \
                                    um den Beginn eines neuen Satzes oder Abschnitts zu erkennen.</html>

keepGrayImages.text          = Graustufenbilder beibehalten
keepGrayImages.toolTipText   = <html>Graustufenbilder in den .omr-Projektdateien beibehalten.<br>\
                                    (Hinweis: Die <b>binäre</b> Version des Bildes wird \
                                    immer beibehalten.)</html>

lyrics.text                  = Liedtext
lyrics.toolTipText           = <html>Textzeilen unterhalb des Notensystems werden \
                                    als Liedtextzeilen interpretiert.</html>

lyricsAboveStaff.text        = Liedtext, auch oberhalb des Notensystems
lyricsAboveStaff.toolTipText = <html>Textzeilen <b>oberhalb</b> des Notensystems, \
                                    sowie ...darunter werden als Liedtextzeilen betrachtet.</html>

multiWholeHeadChords.text    = Akkorde aus ganzen Noten
multiWholeHeadChords.toolTipText = <html>Akkorde, die mehrere ganze Noten enthalten.</html>

partialWholeRests.text       = Pausen, die kürzer als ein Takt sind
partialWholeRests.toolTipText= <html>Pausen können kürzer als ein Takt sein.<br> \
                                    (Gilt nur für die <b>ganze Pause</b>, nicht für Pausen \
                                    größerer Dauer) </html>

pluckings.text               = Anschlagsbezeichnungen (p, i, m, a)
pluckings.toolTipText        = <html>Gitarre, rechte Hand:<br> \
                                    („p“ für Daumen, „i“ für Zeigefinger, „m“ für Mittelfinger, \
                                    „a“ für Ringfinger)</html>

smallHeads.text              = Kleine Notenköpfe
smallHeads.toolTipText       = Notenköpfe in reduzierter Größe

smallBeams.text              = Kleine Balken
smallBeams.toolTipText       = Balken in reduzierter Größe

tremolos.text                = Tremoli
tremolos.toolTipText         = <html>Tremoli mit 1 bis 3 Schrägstrichen.</html>