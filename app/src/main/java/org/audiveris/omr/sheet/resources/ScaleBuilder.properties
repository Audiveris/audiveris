# This file gathers resources to be injected in the ScaleBuilder class
#
# This is the generic (English) version

# Messages

beam.guessed.height             = Beam  guessed height: %2d -- %.2f of [%d..%d] range
beam.measured.height            = Beam measured height: %2d -- %.2f of [%d..%d] range at %d%% of needed quorum
error.in.plotting.black.values  = Error in plotting black values {0}
error.in.plotting.combo.values  = Error in plotting combo values {0}
no.reliable.beam.height.found   = No reliable beam height found, guessed value: {}
sheet.scale.data.already.set    = Sheet scale data already set
significant.beam.peak.detected  = Significant beam peak detected: {0} pixels
user.specified.beam.height      = User-specified beam height: {0} pixels
user.specified.interline        = User-specified interline: {0} pixels

too.few.black.pixels            = {0}\n\\n\
                                  Too few black pixels: {1} of whole image.\n\
                                  This sheet is almost blank.

too.high.interline              = {0}\n\\n\
                                  With a too high interline value ({1} pixels),\n\
                                  this sheet does not seem to contain multi-line staves.\n\n\
                                  This interline value is NOT RELIABLE!

too.low.interline               = {0}\n\\n\
                                  With a too low interline value ({1} pixels),\n\
                                  either this sheet contains no multi-line staves,\n\
                                  or the picture resolution is too low (try 300 DPI).\n\n\
                                  This interline value is NOT RELIABLE!
