SYMBOLS.toolTipText     = Détection des symboles de taille fixe
LINKS.toolTipText       = Connexion et réduction des symboles
RHYTHMS.toolTipText     = Gestion du rythme dans chaque mesure
PAGE.toolTipText        = Connexion des systèmes dans chaque page
