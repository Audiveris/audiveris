# Descriptions

LOAD.toolTipText        = Lecture de l'image en niveaux de gris
BINARY.toolTipText      = Conversion de l'image en noir & blanc
SCALE.toolTipText       = Calcul de l'épaisseur des lignes de portées, des interlignes, des ligatures
GRID.toolTipText        = Détection des lignes de portées, des barres de mesure, des systèmes & parties
HEADERS.toolTipText     = Détection des en-têtes (clef - armure - métrique) de chaque portée
