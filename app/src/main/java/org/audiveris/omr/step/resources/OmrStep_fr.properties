STEMS.toolTipText       = Détection des hampes connectées aux notes ou aux ligatures
REDUCTION.toolTipText   = Résolution des conflits entre notes, hampes et ligatures
CUE_BEAMS.toolTipText   = Détection des petites ligatures
TEXTS.toolTipText       = Reconnaissance de texte
MEASURES.toolTipText    = Détection des mesures selon les groupes de barres de mesure
CHORDS.toolTipText      = Aggrégation des notes en accords
