# This file gathers resources to be injected in the OmrStep class
#
# This is the generic (English) version

# Descriptions

LOAD.text       = Get the sheet gray picture
BINARY.text     = Binarize the sheet gray picture
SCALE.text      = Compute sheet line thickness, interline, beam thickness
GRID.text       = Retrieve staff lines, barlines, systems & parts
HEADERS.text    = Retrieve Clef-Key-Time systems headers
STEM_SEEDS.text = Retrieve stem thickness & seeds for stems
BEAMS.text      = Retrieve beams
LEDGERS.text    = Retrieve ledgers
HEADS.text      = Retrieve note heads
STEMS.text      = Retrieve stems connected to heads & beams
REDUCTION.text  = Reduce conflicts in heads, stems & beams
CUE_BEAMS.text  = Retrieve cue beams
TEXTS.text      = Call OCR on textual items
MEASURES.text   = Retrieve raw measures from groups of barlines
CHORDS.text     = Gather notes heads into chords
CURVES.text     = Retrieve slurs, wedges & endings
SYMBOLS.text    = Retrieve fixed-shape symbols
LINKS.text      = Link and reduce symbols
RHYTHMS.text    = Handle rhythms within measures
PAGE.text       = Connect systems within page
