# This file gathers resources to be injected in the OmrStep class
#
# This is the generic (English) version

# Descriptions

LOAD.toolTipText       = Get the sheet gray picture
BINARY.toolTipText     = Binarize the sheet gray picture
SCALE.toolTipText      = Compute sheet line thickness, interline, beam thickness
GRID.toolTipText       = Retrieve staff lines, barlines, systems & parts
HEADERS.toolTipText    = Retrieve Clef-Key-Time systems headers
STEM_SEEDS.toolTipText = Retrieve stem thickness & seeds for stems
BEAMS.toolTipText      = Retrieve beams
LEDGERS.toolTipText    = Retrieve ledgers
HEADS.toolTipText      = Retrieve note heads
STEMS.toolTipText      = Retrieve stems connected to heads & beams
REDUCTION.toolTipText  = Reduce conflicts in heads, stems & beams
CUE_BEAMS.toolTipText  = Retrieve cue beams
TEXTS.toolTipText      = Call OCR on textual items
MEASURES.toolTipText   = Retrieve raw measures from groups of barlines
CHORDS.toolTipText     = Gather notes heads into chords
CURVES.toolTipText     = Retrieve slurs, wedges & endings
SYMBOLS.toolTipText    = Retrieve fixed-shape symbols
LINKS.toolTipText      = Link and reduce symbols
RHYTHMS.toolTipText    = Handle rhythms within measures
PAGE.toolTipText       = Connect systems within page
