# This file gathers resources to be injected in the EditorMenu class
#
# This is the generic (English) version

# Components

dumpMeasure.text                = Dump measure voices
dumpMeasure.toolTipText         = Dump the voices of the selected measure

dumpSlot.text                   = Dump chords
dumpSlot.toolTipText            = Dump the chords of the selected slot

dumpStack.text                  = Dump stack voices
dumpStack.toolTipText           = Dump the voices of the selected measure stack

dumpVoices.text                 = Dump voices
dumpVoices.toolTipText          = Dump the voices of the selected slot

indent.no.system.text           = Toggle movement start
indent.system.indented.text     = Unmark as movement start
indent.system.not.indented.text = Mark as movement start
# Warning: NO 'indent.text' is defined because it can change dynamically
indent.toolTipText              = Toggle whether this system starts a new movement

lineEditing.text                = Edit lines
lineEditing.toolTipText         = Edit the staff lines individually

logicalMenu.text                = Assign logical
logicalMenu.toolTipText         = Assign the related logical part

logicals.text                   = Edit logical parts
logicals.toolTipText            = Review the definition of all logical parts in score

measure.rhythm.text             = Reprocess rhythm
measure.rhythm.toolTipText      = Reprocess rhythm on the selected measure

merge.text                      = Merge on right
merge.toolTipText               = Merge this measure stack with next one on right

mergeSystem.text                = Merge with system below
mergeSystem.toolTipText         = Merge this system with the one located below

page.rhythm.text                = Reprocess rhythm
page.rhythm.toolTipText         = Redo rhythm and systems connection for current page

parts.text                      = Collate parts
parts.toolTipText               = Collate all parts in score into logical parts

plot.text                       = Staff projection
plot.toolTipText                = Display staff horizontal projection

plotHeader.text                 = Header projection
plotHeader.toolTipText          = Display staff header horizontal projection

staffEditing.text               = Edit staff
staffEditing.toolTipText        = Edit the staff as a whole

# Messages

measure                         = Measure
measure.id                      = Measure #{0}
page                            = Page
page.id                         = Page #{0}
part                            = Part
part.id                         = Part #{0}
score                           = Score
score.id                        = Score #{0}
slot                            = Slot XXX
slot.id                         = Slot #{0} @ {1}
staff                           = Staff
staff.id                        = Staff #{0}
system                          = System
system.id                       = System #{0}
StaffProjector.error            = StaffProjector error {0}
different.measure.counts        = Different measure counts {0} vs {1}
headers.not.yet.available       = HEADERS are not yet available
incompatible.systems            = Incompatible {0} & {1}
mapped.part                     = Mapped {0} to {1}
merge.systems                   = Merge {0} with {1}?
merging.measure                 = Merging measure {0}
misaligned.left.ends            = Misaligned left ends between {0} and {1}
start.about.to.mark             = About to mark system #{0} as a movement start. Do you confirm?
start.about.to.unmark           = About to unmark system #{0} as a movement start. Do you confirm?
