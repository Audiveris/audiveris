# This is the Romanian version

add.Action.text = Adaugă
add.Action.shortDescription = Adaugă un element logic
add.Action.smallIcon = ${smallIcons}/actions/edit_add.png
add.Action.largeIcon = ${largeIcons}/actions/edit_add.png

duplicate.Action.text = Duplică
duplicate.Action.shortDescription = Duplică elementul logic selectat
duplicate.Action.smallIcon = ${smallIcons}/actions/editcopy.png
duplicate.Action.largeIcon = ${largeIcons}/actions/editcopy.png

lock.Action.text = Blochează
lock.Action.shortDescription = Blochează/Deblochează aceste elemente logice
lockedIcon      = ${smallIcons}/filesystems/file_locked.png
unlockedIcon    = ${smallIcons}/filesystems/file.png

moveDown.Action.text = Mută în jos
moveDown.Action.shortDescription = Mută în jos elementul logic selectat
moveDown.Action.smallIcon = ${smallIcons}/actions/down.png
moveDown.Action.largeIcon = ${largeIcons}/actions/down.png

moveUp.Action.text = Mută în sus
moveUp.Action.shortDescription = Mută în sus elementul logic selectat
moveUp.Action.smallIcon = ${smallIcons}/actions/up.png
moveUp.Action.largeIcon = ${largeIcons}/actions/up.png

remove.Action.text = Elimină
remove.Action.shortDescription = Elimină elementul logic selectat
remove.Action.smallIcon = ${smallIcons}/actions/edit_remove.png
remove.Action.largeIcon = ${largeIcons}/actions/edit_remove.png

save.Action.text = Salvează
save.Action.shortDescription = Salvează aceste elemente logice în partitură
save.Action.smallIcon = ${smallIcons}/actions/filesave.png
save.Action.largeIcon = ${largeIcons}/actions/filesave.png

# Messages (NOTA: double any needed quote)

dialog.title    = Editor elemente logice - Partitură #{0} din {1}

headerStaves.text           =   Portative
headerStaves.toolTipText    =   <html>\
                                Listă separată prin virgulă de configurații, câte una pentru fiecare portativ din parte:\
                                <br>- numărul de linii ale portativului\
                                <br>- 's' dacă portativul este mic\
                                <br>\
                                (ex. 5s,5 pentru o parte compusă dintr-un portativ mic cu 5 linii, \
                                urmat de un portativ standard cu 5 linii)\
                                </html>

headerName.text             = Nume
headerName.toolTipText      = Numele complet al părții

headerAbbrev.text           = Abrev.
headerAbbrev.toolTipText    = Nume abreviat, dacă există

headerMidi.text             = MIDI
