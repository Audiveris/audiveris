#
## Switches (alphabetical order preferably)
#
## Scaling processing switches
#
#Switch.oneLineStaves.text               = Portées de percussion à 1 ligne
#Switch.oneLineStaves.toolTipText        = <html>Notation de percussion sans hauteur, \
#                                          se produisant sur des portées d'une seule ligne.</html>
#
#Switch.fourStringTablatures.text        = Tablatures de basse à 4 cordes
#Switch.fourStringTablatures.toolTipText = <html><b>Note</b>\u00a0: De telles tablatures seront détectées \
#                                          mais leur contenu <b>ignoré</b>.</html>
#
#Switch.fiveLineStaves.text              = Portées standard à 5 lignes 
#Switch.fiveLineStaves.toolTipText       = <html>Notation standard, sur portées de cinq lignes.</html>
#
#Switch.drumNotation.text                = Portées de percussions sur 5 lignes
#Switch.drumNotation.toolTipText         = <html>Notation de percussion sans hauteur, \
#                                          se produisant sur des portées de cinq lignes.</html>
#
#Switch.sixStringTablatures.text         = Tablatures de guitare à 6 cordes
#Switch.sixStringTablatures.toolTipText  = <html><b>Note</b>\u00a0: De telles tablatures seront détectées \
#                                          mais leur contenu <b>ignoré</b>.</html>
#
## Other processing switches (in enum order preferably)
#
#Switch.articulations.text           = Articulations
#Switch.articulations.toolTipText    = <html>Accent, tenuto, staccato, staccatissimo, \
#                                             fort accent.</html>
#
#Switch.bothSharedHeadDots.text      = Lier les augmentations aux 2 têtes en mirroir
#Switch.bothSharedHeadDots.toolTipText   = <html>Pour les têtes en mirroir, associer l'augmentation aux <b>deux</b> têtes,\
#                                             <br>au lieu de juste l'accord de plus longue durée.\
#                                             <br>\
#                                             <br><b>Note</b>\u00a0: Ceci s'applique uniquement aux têtes situées \
#                                             <b>entre</b> les lignes de portée ou les lignes supplémentaires.</html>
#
#Switch.chordNames.text              = Noms d'accord
#Switch.chordNames.toolTipText       = <html>par exemple. F&#x266F;m7, Em&#x266D;5, D7&#x266F;5, \
#                                       Am7&#x266D;5, A(9), BMaj7/D&#x266F;</html>
#
#Switch.crossHeads.text              = Notes en croix
#Switch.crossHeads.toolTipText       = <html>Notes <b>Ghost</b>, sans hauteur perceptible, \
#                                      représentées par un '<b>X</b>'.</html>
#
#Switch.fingerings.text              = Doigtés chiffrés
#Switch.fingerings.toolTipText       = <html>Indication du doigt\u00a0: 0, 1, 2, 3, 4, 5.</html>
#
#Switch.frets.text                   = Frettes en chiffres romains (I, II, IV...)
#Switch.frets.toolTipText            = <html>Non encore implémenté</html>
#
#Switch.implicitTuplets.text         = Triplets implicites
#Switch.implicitTuplets.toolTipText  = <html>Si nécessaire, le rythme de la mesure peut être corrigé \
#                                      par insertion automatique de n-olets virtuels.</html>
#
#Switch.indentations.text            = Utiliser l'indentation des systèmes
#Switch.indentations.toolTipText     = <html>S'appuyer sur l'indentation relative d'un système pour \
#                                      détecter le début d'un nouveau mouvement.</html>
#
#Switch.keepGrayImages.text          = Conserver les images en niveaux de gris
#Switch.keepGrayImages.toolTipText   = <html>Conserver les images en niveaux de gris dans les \
