# This file gathers resources to be injected in the Messages class
#
# This is the "de" (German) version

# Single quotes (') must be doubled as ('') to survive the processing done by MessageFormat

MISSING_OPERAND             = Option „{0}“ erfordert einen Operanden
UNDEFINED_OPTION            = „{0}“ ist keine gültige Option
NO_ARGUMENT_ALLOWED         = Es ist kein Argument zulässig: {0}
REQUIRED_OPTION_MISSING     = Option „{0}“ ist erforderlich
REQUIRED_ARGUMENT_MISSING   = Argument „{0}“ ist erforderlich
TOO_MANY_ARGUMENTS          = Zu viele Argumente: {0}
METADATA_ERROR              = Probleme beim Lesen der Argumentkonfiguration.
MULTIPLE_USE_OF_ARGUMENT    = Argument mit Index {0} wird mehrfach verwendet
MULTIPLE_USE_OF_OPTION      = Optionsname „{0}“ wird mehrfach verwendet
UNKNOWN_HANDLER             = Es ist kein OptionHandler für „{0}“ registriert
NO_OPTIONHANDLER            = Keine OptionHandler-Klasse
NO_CONSTRUCTOR_ON_HANDLER   = „{0}“ verfügt nicht über den erforderlichen Konstruktor
REQUIRES_OPTION_MISSING     = Option „{0}“ erfordert die Option(en) {1}
FORBIDDEN_OPTION_PRESENT    = Option „{0}“ kann nicht zusammen mit der/den Option(en) {1} verwendet werden
NO_SUCH_FILE                = Datei nicht gefunden: {0}
DEFAULT_VALUE               = (Standardwert: {0})