
name: Build schema doc

on:
  - workflow_dispatch

permissions:
  contents: write

jobs:
  # Build the schema documentation
  build-schema-doc:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Retrieve Gradle properties
        shell: bash
        id: all
        run: |
          # Expose every 'key = value' of gradle.properties as a step output
          grep -E '^[[:space:]]*[A-Za-z0-9_.]+[[:space:]]*=' gradle.properties \
            | sed -E 's/^[[:space:]]*([A-Za-z0-9_.]+)[[:space:]]*=[[:space:]]*(.*[^[:space:]])?[[:space:]]*$/\1=\2/' \
            >> "$GITHUB_OUTPUT"

      - name: Setup Java ${{ steps.all.outputs.theMinJavaVersion }}
        uses: actions/setup-java@v5
        with:
          java-version: ${{ steps.all.outputs.theMinJavaVersion }}
          distribution: zulu

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6
        
      - name: Install xsltproc
        run: |
          sudo apt update
          sudo apt install xsltproc
          xsltproc --version

      - name: Build schema doc
        run: ./gradlew --info :schemas:genSchemaDoc

      - name: Upload schema doc
        id: upload-schema-doc
        uses: actions/upload-artifact@v7
        with:
          name: schema-doc
          path: schemas/build/distributions/*
          compression-level: 0
          overwrite: true
